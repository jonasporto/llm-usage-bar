name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify version tag
        run: |
          app_version=$(/usr/libexec/PlistBuddy -c \
            'Print :CFBundleShortVersionString' "Claude Usage.app/Contents/Info.plist")
          test "$GITHUB_REF_NAME" = "v$app_version"

      - name: Build and test
        run: |
          swift build
          swift test

      - name: Assemble and verify source installer
        env:
          LLM_USAGE_BAR_INSTALL_DIR: ${{ runner.temp }}/Applications
          LLM_USAGE_BAR_SKIP_OPEN: 1
        run: |
          git archive --format=tar.gz --prefix=llm-usage-bar/ \
            --output="$RUNNER_TEMP/llm-usage-bar-source.tar.gz" HEAD
          LLM_USAGE_BAR_SOURCE_URL="file://$RUNNER_TEMP/llm-usage-bar-source.tar.gz" \
            sh < install.sh
          test -x "$LLM_USAGE_BAR_INSTALL_DIR/Claude Usage.app/Contents/MacOS/ClaudeUsageBar"
          codesign --verify "$LLM_USAGE_BAR_INSTALL_DIR/Claude Usage.app"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            install.sh \
            "$RUNNER_TEMP/llm-usage-bar-source.tar.gz#llm-usage-bar-source.tar.gz" \
            --verify-tag \
            --generate-notes \
            --latest \
            --title "$GITHUB_REF_NAME"
