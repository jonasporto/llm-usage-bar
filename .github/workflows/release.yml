name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify version tag
        run: |
          app_version=$(/usr/libexec/PlistBuddy -c \
            'Print :CFBundleShortVersionString' "LLM Usage.app/Contents/Info.plist")
          test "$GITHUB_REF_NAME" = "v$app_version"

      - name: Build and test
        run: |
          swift build
          swift test

      - name: Assemble and verify source installer
        env:
          LLM_USAGE_BAR_INSTALL_DIR: ${{ runner.temp }}/Applications
          LLM_USAGE_BAR_SKIP_OPEN: 1
          LLM_USAGE_BAR_SKIP_LOGIN_ITEM: 1
        run: |
          git archive --format=tar.gz --prefix=llm-usage-bar/ \
            --output="$RUNNER_TEMP/llm-usage-bar-source.tar.gz" HEAD
          LLM_USAGE_BAR_SOURCE_URL="file://$RUNNER_TEMP/llm-usage-bar-source.tar.gz" \
            sh < install.sh
          test -x "$LLM_USAGE_BAR_INSTALL_DIR/LLM Usage.app/Contents/MacOS/LLMUsageBar"
          codesign --verify "$LLM_USAGE_BAR_INSTALL_DIR/LLM Usage.app"

      - name: Verify the installer bootstraps the configuration
        run: |
          config_dir="${XDG_CONFIG_HOME:-$HOME/.config}/llm-usage-bar"
          adapters_dir="${XDG_DATA_HOME:-$HOME/.local/share}/llm-usage-bar/adapters"
          test -f "$config_dir/profiles.json"
          test -f "$config_dir/profiles.example.json"
          test -f "$config_dir/config.json"
          python3 -c "import json,sys; assert json.load(open(sys.argv[1]))['refreshSeconds']" \
            "$config_dir/config.json"
          test -f "$config_dir/icons/anthropic.svg"
          test -f "$config_dir/icons/example.svg"
          test -x "$adapters_dir/example-usage"
          python3 -c "import json,sys; json.load(open(sys.argv[1]))" \
            "$config_dir/profiles.json"
          "$adapters_dir/example-usage" --home "$HOME" >/dev/null

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            install.sh \
            "$RUNNER_TEMP/llm-usage-bar-source.tar.gz#llm-usage-bar-source.tar.gz" \
            --verify-tag \
            --generate-notes \
            --latest \
            --title "$GITHUB_REF_NAME"
